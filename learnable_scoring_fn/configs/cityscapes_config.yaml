# Configuration for Cityscapes dataset
# Inherits from base config and overrides specific values

base_config: base_config.yaml

# Dataset specific overrides
dataset:
  name: cityscapes
  num_classes: 8  # Cityscapes has 8 object classes
  # Note: cache_dir will be set based on selected model
  # e.g., cache_base_model_resnet101_cityscapes

# Using same configuration as COCO for now
# All other parameters (loss, training, calibration) inherited from base_config