# Size-aware configuration for symmetric adaptive conformal prediction
# This config inherits from base_config.yaml and overrides specific values

# Base configuration to inherit from
base_config: base_config.yaml

# Override specific settings for size-aware training

# Loss configuration overrides
loss:
  use_size_aware_loss: true
  size_targets:
    small: 0.90    # Target 90% for small objects
    medium: 0.89   # Target 89% for medium objects  
    large: 0.85    # Target 85% for large objects
  lambda_efficiency: 0.25  # Reduced to prevent aggressive minimization
  
# Model architecture overrides  
model:
  architecture:
    hidden_dims: [256, 128, 64]  # Deeper network for size-aware adaptation

# Training overrides
training:
  learning_rate: 0.0005  # Lower LR for more stable training
  grad_clip_norm: 0.5    # More aggressive clipping for stability

# Calibration overrides
calibration:
  min_tau: 0.2  # Higher min tau to work with new model scale
  max_tau: 5.0  # Higher max tau for new model dynamics